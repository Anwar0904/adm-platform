name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Synthetic build-only configuration; this artifact is not deployable.
      NEXT_PUBLIC_SITE_URL: https://adm-ci.invalid
      JWT_ACCESS_SECRET: ci-build-only-not-for-production-access-0123456789abcdef
      JWT_REFRESH_SECRET: ci-build-only-not-for-production-refresh-fedcba9876543210
      MONGODB_URI: mongodb://ci-db.invalid:27017/adm-build-only
      MONGODB_DB: adm-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke check public static SEO routes without MongoDB
        run: |
          npm run start > /tmp/adm-platform.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then break; fi
            sleep 2
          done
          SMOKE_BASE_URL=http://127.0.0.1:3000 \
          CANONICAL_ORIGIN="$NEXT_PUBLIC_SITE_URL" \
            python3 scripts/verify-static-seo.py

  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
